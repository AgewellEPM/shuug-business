name: RideshareTaxPros
options:
  bundleIdPrefix: com.ridesharetaxpros
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  DriverCore:
    path: DriverCore
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targets:
  RideshareTaxPros:
    type: application
    platform: iOS
    sources: [App, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Rideshare Tax Pros
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan receipts you choose to attach to your expense records.
        NSLocationWhenInUseUsageDescription: Record mileage during drives you start. Location updates continue in the background during that drive and stop when you end it.
        NSLocationTemporaryUsageDescriptionDictionary:
          TripMileage: Precise location improves the mileage recorded during your drive.
        UIBackgroundModes: [location]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - package: DriverCore
schemes:
  RideshareTaxPros:
    build:
      targets:
        RideshareTaxPros: all
    run:
      config: Debug
    archive:
      config: Release
