name: RideshareTaxPros
options:
  bundleIdPrefix: com.ridesharetaxpros
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  DriverCore:
    path: DriverCore
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    exactVersion: 7.3.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targets:
  RideshareTaxPros:
    type: application
    platform: iOS
    sources: [App, Resources, Shared]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gig Tax Pros
        CFBundleName: Gig Tax Pros
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        RTPBankLinkDomain: $(RTP_BANK_LINK_DOMAIN)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan receipts you choose to attach to your expense records.
        NSLocationWhenInUseUsageDescription: Record driving mileage and, if you enable assistance, detect drives and remind you to log purchases near a stop.
        NSLocationAlwaysAndWhenInUseUsageDescription: With optional assistance enabled, detect driving and stops near fuel, food and auto businesses even while this app is in the background. You control both options in Account.
        NSMotionUsageDescription: Use movement activity to help distinguish driving from walking when you enable automatic assistance.
        NSLocationTemporaryUsageDescriptionDictionary:
          TripMileage: Precise location improves the mileage recorded during your drive.
        UIBackgroundModes: [location]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: RideshareTaxPros.entitlements
        RTP_BANK_LINK_DOMAIN: rideshare-tax-pros.pages.dev
    dependencies:
      - package: DriverCore
      - package: LinkKit
        product: LinkKit
      - target: GigOfferBroadcast
        embed: true
      - target: GigOfferShare
        embed: true
      - target: GigNotificationContent
        embed: true
  GigNotificationContent:
    type: app-extension
    platform: iOS
    sources: [NotificationContent, App/Brand.swift, Resources/SharedBrand.xcassets]
    info:
      path: NotificationContent/Info.plist
      properties:
        CFBundleDisplayName: Gig Tax Pros
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.content-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).BrandedNotificationController
          NSExtensionAttributes:
            UNNotificationExtensionCategory: [startTrip, endTrip, classifyTrip, tripFare, expense, gig.status, gig.offer, gig.offer.review]
            UNNotificationExtensionInitialContentSizeRatio: 0.7
            UNNotificationExtensionDefaultContentHidden: true
            UNNotificationExtensionUserInteractionEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver.notificationcontent
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: UserNotifications.framework
      - sdk: UserNotificationsUI.framework
  GigOfferShare:
    type: app-extension
    platform: iOS
    sources: [ShareOffer, Shared]
    info:
      path: ShareOffer/Info.plist
      properties:
        CFBundleDisplayName: Gig Tax Pros
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver.offershare
        CODE_SIGN_ENTITLEMENTS: BroadcastUpload/OfferBroadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: DriverCore
  GigOfferBroadcast:
    type: app-extension
    platform: iOS
    sources: [BroadcastUpload, Shared]
    info:
      path: BroadcastUpload/Info.plist
      properties:
        CFBundleDisplayName: Gig Tax Pros Offer Reader
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          NSExtensionAttributes:
            RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver.offerbroadcast
        CODE_SIGN_ENTITLEMENTS: BroadcastUpload/OfferBroadcast.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: DriverCore
  RideshareTaxProsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RideshareTaxPros
    dependencies:
      - target: RideshareTaxPros
schemes:
  RideshareTaxPros:
    build:
      targets:
        RideshareTaxPros: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RideshareTaxProsUITests]
    archive:
      config: Release
