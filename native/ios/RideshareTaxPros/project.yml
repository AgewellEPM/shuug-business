name: RideshareTaxPros
options:
  bundleIdPrefix: com.ridesharetaxpros
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
packages:
  DriverCore:
    path: DriverCore
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios-spm
    exactVersion: 7.3.1
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    CURRENT_PROJECT_VERSION: '1'
    MARKETING_VERSION: '0.1.0'
targets:
  RideshareTaxPros:
    type: application
    platform: iOS
    sources: [App, Resources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Gig Tax Pros
        CFBundleName: Gig Tax Pros
        CFBundleShortVersionString: '0.1.0'
        CFBundleVersion: '1'
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        RTPBankLinkDomain: $(RTP_BANK_LINK_DOMAIN)
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        'UISupportedInterfaceOrientations~ipad': [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: Scan receipts you choose to attach to your expense records.
        NSLocationWhenInUseUsageDescription: Record driving mileage and, if you enable assistance, detect drives and remind you to log purchases near a stop.
        NSLocationAlwaysAndWhenInUseUsageDescription: With optional assistance enabled, detect driving and stops near fuel, food and auto businesses even while this app is in the background. You control both options in Account.
        NSMotionUsageDescription: Use movement activity to help distinguish driving from walking when you enable automatic assistance.
        NSLocationTemporaryUsageDescriptionDictionary:
          TripMileage: Precise location improves the mileage recorded during your drive.
        UIBackgroundModes: [location]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: RideshareTaxPros.entitlements
        RTP_BANK_LINK_DOMAIN: rideshare-tax-pros.pages.dev
    dependencies:
      - package: DriverCore
      - package: LinkKit
        product: LinkKit
  RideshareTaxProsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridesharetaxpros.driver.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RideshareTaxPros
    dependencies:
      - target: RideshareTaxPros
schemes:
  RideshareTaxPros:
    build:
      targets:
        RideshareTaxPros: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [RideshareTaxProsUITests]
    archive:
      config: Release
