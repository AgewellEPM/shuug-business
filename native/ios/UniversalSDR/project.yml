name: UniversalSDR
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  UniversalSDR:
    type: application
    platform: iOS
    sources:
      - App
      - ../../macos/SDRWrapper/Capture.swift
    settings:
      base:
        PRODUCT_NAME: Universal SDR
        PRODUCT_BUNDLE_IDENTIFIER: com.shuug.universal-sdr.ipad
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Universal SDR
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  UniversalSDRUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.shuug.universal-sdr.ipad.uitests
      GENERATE_INFOPLIST_FILE: YES
      TARGETED_DEVICE_FAMILY: "2"
    dependencies:
      - target: UniversalSDR
schemes:
  UniversalSDR:
    build:
      targets:
        UniversalSDR: all
    test:
      targets:
        - UniversalSDRUITests
