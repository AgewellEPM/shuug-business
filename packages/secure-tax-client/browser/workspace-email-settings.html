<details data-sign-in-email hidden>
  <summary>Set your sign-in email</summary>
  <p>Use this email with your existing password next time.</p>
  <form method="post" autocomplete="on">
    <label>Sign-in email<input name="email" type="email" autocomplete="username" maxlength="240" required disabled></label>
    <label>Current password<input name="password" type="password" autocomplete="current-password" maxlength="200" required disabled></label>
    <button type="submit" disabled>Save sign-in email</button>
  </form>
</details>
